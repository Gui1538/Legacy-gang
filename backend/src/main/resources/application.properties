spring.application.name=vv
server.port=8080

# ---- Banco de dados MySQL (o schema é criado automaticamente se não existir) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_vv?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:153826}

# ---- JPA: cria/atualiza as tabelas sozinho (ideal para MVP/acadêmico) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- Login com Google: cole aqui o Client ID (ou use a variável GOOGLE_CLIENT_ID) ----
app.google.client-id=${GOOGLE_CLIENT_ID:829201864331-j8n04m5hj05bks8kta09akov0qtktk12.apps.googleusercontent.com}

# ---- Endereço do front-end liberado no CORS ----
app.cors.origem=http://localhost:4200
